# Netlify build configuration — takes precedence over UI settings.
# Publishes ONLY the deploy/ folder so private repo files (CLAUDE.md, source
# images) are never served on lockingbible.com.
[build]
  command = "rm -rf deploy && mkdir -p deploy && cp index.html 404.html sitemap.xml robots.txt icon.png favicon.png favicon.ico apple-touch-icon.png og-image.png deploy/ && cp -R privacy support terms assets deploy/"
  publish = "deploy"

# Old Locking Bible URLs and typos land on the right page.
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/terms-of-use"
  to = "/terms/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
